<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#20252c">
  <title>{% block title %}Fahrgastrechte-Sammler{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
{% if current_user.is_authenticated %}
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('index') }}">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64"><path d="M16 7h32c6 0 10 5 10 11v23c0 5-4 9-9 9h-2l6 7h-8l-5-7H24l-5 7h-8l6-7h-2c-5 0-9-4-9-9V18C6 12 10 7 16 7Zm1 8c-2 0-3 2-3 4v10h36V19c0-2-1-4-3-4H17Zm2 21a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm26 0a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/></svg>
      </span>
      <span><strong>Fahrgastrechte-</strong><em>Sammler</em></span>
    </a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div id="nav" class="collapse navbar-collapse">
      <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <a class="nav-link" href="{{ url_for('journey_new') }}">Neue Fahrt</a>
        <a class="nav-link" href="{{ url_for('account') }}">Konto</a>
        <form method="post" action="{{ url_for('logout') }}"><button class="btn btn-sm btn-outline-light">Abmelden</button></form>
      </div>
    </div>
  </div>
</nav>
{% endif %}
<main class="container py-4">
  {% for category,message in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{ category }} rounded-1">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
