services:
  fahrgastrechte:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      TZ: Europe/Berlin
      APP_DATA_DIR: /data
      APP_BACKUP_DIR: /backups
    volumes:
      - ./data:/data
      - ./backups:/backups
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
